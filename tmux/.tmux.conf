# 前缀键：明确使用默认的 Ctrl+b。
set-option -g prefix C-b
bind-key C-b send-prefix

# Ctrl+b 后按 h/j/k/l：在窗格之间移动（左/下/上/右）。
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Ctrl+b 后按 | 或 -：分割当前窗格，并保持在当前目录。
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# 启用鼠标支持，包括使用滚轮查看当前窗格的历史输出。
set-option -g mouse on
set-option -g history-limit 100000

# 优化复制模式，并将选中的内容复制到系统剪贴板。
# 复制工具优先级：Wayland -> X11 -> macOS -> WSL/Windows。本机已安装 xclip。
set-window-option -g mode-keys vi
set-option -g set-clipboard on
set-option -g @copy_command 'sh -c "if command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; else cat >/dev/null; fi"'

# 鼠标选择：拖选后松开鼠标，直接复制到系统剪贴板。
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# 键盘复制模式快捷键：同样复制到系统剪贴板。
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"
