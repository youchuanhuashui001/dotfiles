# 设置前缀键为 Ctrl+w
unbind C-b
set -g prefix C-w
bind C-w send-prefix

# 分屏快捷键
unbind %
bind | split-window -h      # 垂直分屏
unbind '"'
bind - split-window -v      # 水平分屏

# 窗格切换，使用 Ctrl+w 后按 h/j/k/l
bind h select-pane -L       # 切换到左侧窗格
bind j select-pane -D       # 切换到下方窗格
bind k select-pane -U       # 切换到上方窗格
bind l select-pane -R       # 切换到右侧窗格

# 终端设置
set -g default-terminal "xterm-256color"

# 开启鼠标支持
set -g mouse on

# 复制到系统剪贴板
set-option -g set-clipboard on
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# 启用 vi 模式
set-window-option -g mode-keys vi

# 鼠标拖动选择内容后自动复制到系统剪贴板：鼠标选中需要复制的内容，按下 y 后松开鼠标，即可复制到系统剪贴板
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# 插件管理
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# 运行 tpm
run '~/.tmux/plugins/tpm/tpm'